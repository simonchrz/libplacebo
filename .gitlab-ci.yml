workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
    - compile
    - test
    - sanitize

variables:
    GIT_SUBMODULE_STRATEGY: recursive
    IMAGE_UBUNTU_NOBLE: registry.videolan.org/libplacebo-ubuntu-noble:20260108182833
    IMAGE_UBUNTU_NOBLE_AARCH: registry.videolan.org/libplacebo-ubuntu-noble-aarch64:20260110170627

linux:
    image: $IMAGE_UBUNTU_NOBLE
    stage: compile
    tags:
        - docker
        - amd64
    script:
        - meson build --buildtype release
                      --werror
                      -Dtests=true
                      -Dshaderc=enabled
                      -Dglslang=enabled
                      -Dvulkan-sdk=$VULKAN_SDK
        - ninja -C build

static:
    image: $IMAGE_UBUNTU_NOBLE
    stage: compile
    tags:
        - docker
        - amd64
    script:
        - meson build --buildtype release
                      --default-library static
                      --werror
                      -Dshaderc=enabled
                      -Dglslang=enabled
                      -Dvulkan-sdk=$VULKAN_SDK
        - ninja -C build

win32:
    image: $IMAGE_UBUNTU_NOBLE
    stage: compile
    tags:
        - docker
        - amd64
    script:
        - meson build --buildtype release
                      --werror
                      -Dtests=true
                      -Ddebug-abort=true
                      -Dd3d11=enabled
                      -Dshaderc=disabled
                      -Dvk-proc-addr=disabled
                      --cross-file i686-w64-mingw32.meson
        - ninja -C build
        - cd build && meson test -t 5 -v --num-processes=1

win64:
    image: $IMAGE_UBUNTU_NOBLE
    stage: compile
    tags:
        - docker
        - amd64
    script:
        - meson build --buildtype release
                      --werror
                      -Dtests=true
                      -Ddebug-abort=true
                      -Dd3d11=enabled
                      -Dshaderc=disabled
                      -Dvk-proc-addr=disabled
                      --cross-file x86_64-w64-mingw32.meson
        - ninja -C build
        - cd build && meson test -t 5 -v --num-processes=1

aarch64:
    image: $IMAGE_UBUNTU_NOBLE_AARCH
    stage: compile
    tags:
        - docker
        - aarch64
    script:
        - meson build --buildtype release --werror -Dtests=true
        - ninja -C build
        - cd build && meson test -t 5 -v --num-processes=1

macos:
    stage: compile
    tags:
        - amd64
        - monterey
    script:
        - python3 -m venv venv
        - source venv/bin/activate
        - pip install meson
        - meson build --buildtype release
                      -Ddefault_library=both
                      -Dtests=true
                      -Ddebug-abort=true
                      -Dc_args='-mmacosx-version-min=10.11 -Wunguarded-availability'
                      --werror
        - ninja -C build
        - cd build && meson test -t 5 -v --num-processes=1

# Metal backend on the M1 runner (macos-xcode26) — native Apple Silicon with a
# real GPU, so test.metal.m actually runs (buffer/texture/shader round-trips)
# instead of skipping. The runner has neither SPIRV-Cross (SPIR-V→MSL) nor a
# GLSL→SPIR-V compiler, and Homebrew is not writable by the CI user, so both are
# built from source: SPIRV-Cross (found via pkg-config) and glslang (found via
# -Dvulkan-sdk + CPATH). min-version 10.15 for MTLCommandBuffer.GPUStartTime/EndTime.
macos-metal:
    stage: compile
    tags:
        - macos-xcode26
    variables:
        SPVC_PREFIX: $CI_PROJECT_DIR/spvc
        GLSLANG_PREFIX: $CI_PROJECT_DIR/glslang-prefix
    script:
        - git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Cross.git spvc-src
        - cmake -S spvc-src -B spvc-src/build -DCMAKE_BUILD_TYPE=Release
                -DCMAKE_INSTALL_PREFIX=$SPVC_PREFIX -DSPIRV_CROSS_SHARED=ON
                -DSPIRV_CROSS_CLI=OFF -DSPIRV_CROSS_ENABLE_TESTS=OFF
        - cmake --build spvc-src/build --target install --parallel
        - git clone --depth 1 https://github.com/KhronosGroup/glslang.git glslang-src
        - cmake -S glslang-src -B glslang-src/build -DCMAKE_BUILD_TYPE=Release
                -DENABLE_OPT=OFF -DCMAKE_INSTALL_PREFIX=$GLSLANG_PREFIX
                -DBUILD_SHARED_LIBS=OFF -DGLSLANG_TESTS=OFF -DENABLE_GLSLANG_BINARIES=OFF
        - cmake --build glslang-src/build --target install --parallel
        - export PKG_CONFIG_PATH="$SPVC_PREFIX/lib/pkgconfig"
        - export CPATH="$GLSLANG_PREFIX/include"
        - python3 -m venv venv
        - source venv/bin/activate
        - pip install meson
        - meson build --buildtype release
                      -Ddefault_library=both
                      -Dtests=true
                      -Ddebug-abort=true
                      -Dmetal=enabled
                      -Dglslang=enabled
                      -Dvulkan-sdk=$GLSLANG_PREFIX
                      -Dc_args='-mmacosx-version-min=10.15 -Wunguarded-availability'
                      --werror
        - ninja -C build
        - cd build && meson test -t 5 -v --num-processes=1

scan:
    image: $IMAGE_UBUNTU_NOBLE
    stage: compile
    tags:
        - docker
        - amd64
    script:
        - env CC=clang CXX=clang++ CC_LD=lld CXX_LD=lld
            meson build --buildtype debugoptimized
                        --werror
                        -Dtests=true
                        -Dbench=true
                        -Dshaderc=enabled
                        -Dglslang=enabled
                        -Dvulkan-sdk=$VULKAN_SDK
        - ninja -C build scan-build

llvmpipe:
    image: $IMAGE_UBUNTU_NOBLE
    stage: test
    tags:
        - docker
        - amd64
    script:
        - meson build --buildtype debugoptimized
                      --werror
                      -Dtests=true
                      -Ddebug-abort=true
                      -Dc_args='-DCI_ALLOW_SW -DCI_MAXGL'
                      -Dshaderc=enabled
                      -Dglslang=enabled
                      -Dvulkan-sdk=$VULKAN_SDK
        - ninja -C build
        - cd build && meson test -t 20 -v --num-processes=1

gpu:
    image: $IMAGE_UBUNTU_NOBLE
    stage: test
    tags:
        - gpu
    script:
        - git clone --depth 1 -b v1.16 https://github.com/linux-test-project/lcov.git
        - export PATH="`realpath lcov/bin`:$PATH"
        - meson build --buildtype debugoptimized
                      --werror
                      -Dtests=true
                      -Ddemos=false
                      -Ddebug-abort=true
                      -Dshaderc=enabled
                      -Dglslang=enabled
                      -Dvulkan-sdk=$VULKAN_SDK
                      -Db_coverage=true
        - ninja -C build
        - vulkaninfo
        - cd build && meson test -t 5 -v --num-processes=1
        - ninja coverage-html
        - mv meson-logs/coveragereport ../coverage
        - ninja coverage-xml
        - grep -Eo 'line-rate="[^"]+"' meson-logs/coverage.xml | head -n 1 |
          grep -Eo '[0-9.]+' | awk '{ print "coverage:", $1 * 100 } '
    coverage: '/^coverage: (\d+.\d+)$/'
    artifacts:
        expose_as: 'Coverage HTML report'
        paths:
            - coverage/
        reports:
            coverage_report:
              coverage_format: cobertura
              path: build/meson-logs/coverage.xml

sanitize:
    image: $IMAGE_UBUNTU_NOBLE
    stage: sanitize
    tags:
        - gpu
    variables:
        # Disable leak detection, mesa likes to leak some memory, and since
        # the driver is unloaded we can't really add suppressions for them.
        # https://gitlab.freedesktop.org/mesa/mesa/-/issues/12805
        # https://gitlab.freedesktop.org/mesa/mesa/-/issues/12811
        ASAN_OPTIONS: "halt_on_error=1:abort_on_error=1:print_summary=1:detect_leaks=0"
    script:
        - env CC=clang CXX=clang++ CC_LD=lld CXX_LD=lld
            meson build --buildtype debugoptimized
                        --werror
                        -Dtests=true
                        -Ddebug-abort=true
                        -Dc_args='-DCI_MAXGL -Wno-deprecated-declarations'
                        -Db_sanitize=address,undefined
                        -Db_lundef=false
                        -Dshaderc=enabled
        - ninja -C build
        - cd build && time meson test -t 5 -v --num-processes=1
